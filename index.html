<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Two-Column Hero Section</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="hero">
    <div class="hero-content">
      <h1>Picture-Perfect Hairstyles</h1>
      <p>Transform Your Look: Upload Your Photo and Discover Your Perfect Hairstyle at Our Barbershop!</p>
      <a href="#" class="btn" id="hero-btn">Get Started</a>
    </div>
    <div class="hero-image">
      <img src="https://i.pinimg.com/originals/58/9c/8f/589c8f066bff424545264486fa277c38.jpg" alt="Hero Image">
    </div>
  </section>

  <section class="card-container">
    <div class="card">
      <img src="https://via.placeholder.com/300x180" alt="Card Image">
      <div class="card-content">
        <h3>Card Title</h3>
        <p>This is a brief description of the card's content.</p>
        <a href="#" class="btn">Learn More</a>
      </div>
    </div>
    
    <div class="card">
      <img src="https://via.placeholder.com/300x180" alt="Card Image">
      <div class="card-content">
        <h3>Another Card</h3>
        <p>More information in a clean, modern layout.</p>
        <a href="#" class="btn">Read More</a>
      </div>
    </div>
  </section>

</body>
</html>
